<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Czech A2 — Dialogue Practice v3</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <h1>🎧 Czech A2 — Dialogue Practice (v3)</h1>

  <div class="top-bar">
    <span id="dialogueTitle">Nádraží – slevová karta</span>
    <span class="points">⭐ Points: <span class="num" id="pointsValue">10</span></span>
  </div>

  <div class="settings">
    <select id="dialogueSelect"></select>
    <div class="level-toggle">
      <button data-level="dumb" id="dumbBtn">Dumb</button>
      <button data-level="easy" id="easyBtn" class="active">Easy</button>
      <button data-level="normal" id="normalBtn">Normal</button>
    </div>
  </div>
  
    <div class="situation-box" id="situationBox" style="display:none;">
    <div class="situation-label">Situace</div>
    <div class="situation-text" id="situationText"></div>
    <div class="situation-translation" id="situationTranslation"></div>
  </div>

  <div class="scene">
    <img class="clerk-photo" id="clerkPhoto"
         src="https://api.dicebear.com/7.x/avataaars/svg?seed=Jana&backgroundColor=b6e3f4"
         alt="Clerk">
    <div class="clerk-bubble">
      <div class="clerk-label" id="clerkLabel">Pokladní (Clerk)</div>
      <div class="clerk-spoken" id="clerkSpoken">🔊 Click "Play question" to hear the clerk.</div>
      <div class="clerk-written" id="clerkWritten"></div>
      <div class="clerk-translation" id="clerkTranslation"></div>
    </div>
  </div>

  <div class="student-bubble" id="studentBubble">
    <div class="student-label">Vy (Student)</div>
    <div class="student-line" id="studentLine"></div>
  </div>

  <div class="buttons">
    <button class="play-btn" id="playBtn">🔊 Play question</button>
    <button class="hint-btn" id="hintBtn">💡 Show text (−2 ⭐)</button>
    <button class="record-btn" id="recordBtn">🎤 Speak answer</button>
    <button class="continue-btn" id="continueBtn" style="display:none;">➡️ Continue</button>
    <button class="next-btn" id="nextBtn" style="display:none;">➡️ Next</button>
  </div>

  <div class="status" id="status"></div>

  <div class="result-box" id="resultBox">
    Your feedback will appear here after you speak.
  </div>
</div>

<script src="content/concepts.js"></script>
<script src="content/station-card-1.js"></script>
<script src="content/station-card-2.js"></script>
<script src="content/optika-1.js"></script>
<script src="content/optika-2.js"></script>
<script src="content/ridicsky-prukaz-1.js"></script>
<script src="engine/text.js"></script>
<script src="engine/matcher.js"></script>
<script src="engine/validator.js"></script>
<script src="engine/session.js"></script>
<script src="engine/speech.js"></script>
<script src="app.js"></script>
</body>
</html>
