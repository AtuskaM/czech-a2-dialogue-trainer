const synonymMap = {};
for (const group of synonyms) {
  const canonical = group[0];
  for (const word of group) synonymMap[word] = canonical;
}
function canonicalize(word) { return synonymMap[word] || word; }

// ============================================================
// NUMBER WORD CONVERTER (for Dumb/Easy levels)
// ============================================================
function numberToCzechWords(num) {
  const map = {
    0:"nula",1:"jeden",2:"dva",3:"tři",4:"čtyři",5:"pět",6:"šest",7:"sedm",8:"osm",9:"devět",
    10:"deset",11:"jedenáct",12:"dvanáct",13:"třináct",14:"čtrnáct",15:"patnáct",16:"šestnáct",
    17:"sedmnáct",18:"osmnáct",19:"devatenáct",20:"dvacet",30:"třicet",40:"čtyřicet",50:"padesát",
    60:"šedesát",70:"sedmdesát",80:"osmdesát",90:"devadesát",100:"sto",200:"dvě stě",300:"tři sta",
    400:"čtyři sta",500:"pět set",600:"šest set",700:"sedm set",800:"osm set",900:"devět set",
    1000:"jeden tisíc",2000:"dva tisíce",3000:"tři tisíce",4000:"čtyři tisíce",5000:"pět tisíc"
  };
  if (map[num]) return map[num];
  if (num < 100) {
    const tens = Math.floor(num/10)*10;
    const units = num%10;
    return map[tens] + " " + map[units];
  }
  if (num < 1000) {
    const hundreds = Math.floor(num/100)*100;
    const rest = num%100;
    return map[hundreds] + (rest ? " " + numberToCzechWords(rest) : "");
  }
  if (num < 10000) {
    const thousands = Math.floor(num/1000)*1000;
    const rest = num%1000;
    return map[thousands] + (rest ? " " + numberToCzechWords(rest) : "");
  }
  return String(num);
}

function convertNumbersToWords(text) {
  return text.replace(/\b(\d{1,4})\b/g, (match) => numberToCzechWords(parseInt(match)));
}

function formatText(text, level) {
  // Always convert numbers to Czech words — TTS reads them correctly this way
  return convertNumbersToWords(text);
}

// ============================================================
// GAME STATE

let currentDialogueIndex = 0;

let isRecording = false;

let attemptsThisNode = 0;
let usedAlternativeThisNode = false;

const CORRECT_THRESHOLD = 40;
const MAX_ATTEMPTS = 3;

// ELEMENTS

// ============================================================
// SPEECH SYNTHESIS
// ============================================================
function speak(text) {
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'cs-CZ';
  utterance.rate = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const czech = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('cs'));
  if (czech) utterance.voice = czech;
  window.speechSynthesis.speak(utterance);
}

// ============================================================
// SPEECH RECOGNITION
// ============================================================
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'cs-CZ';
  recognition.continuous = false;
  recognition.interimResults = false;
} else {
  statusEl.textContent = "⚠️ Speech recognition not supported. Please use Chrome.";
}

// ============================================================
// VALIDATOR
// ============================================================
function normalize(text) {
  // First convert numbers to Czech words, then lowercase & clean
  const withWords = convertNumbersToWords(text);
  return withWords.toLowerCase().replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').trim();
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

// Try splitting a glued word into two parts and matching each part
function splitAndMatch(gluedWord, expWords) {
  // Only try for words > 6 chars
  if (gluedWord.length < 6) return null;
  for (let i = 3; i < gluedWord.length - 2; i++) {
    const part1 = gluedWord.slice(0, i);
    const part2 = gluedWord.slice(i);
    // Check if both parts match two different expected words
    const match1 = expWords.find(w => wordsMatch(w, part1));
    const match2 = expWords.find(w => wordsMatch(w, part2));
    if (match1 && match2 && match1 !== match2) {
      return [match1, match2];
    }
  }
  return null;
}

function wordsMatch(a, b) {
  if (a === b) return true;
  if (canonicalize(a) === canonicalize(b)) return true;
  const maxDist = Math.max(a.length, b.length) > 4 ? 1 : 0;
  return levenshtein(a, b) <= maxDist;
}

function scoreOne(expected, actual) {
  const FILLERS = ['hm', 'no', 'tak', 'já', 'ty', 'prostě', 'jako', 'eee', 'ehm', 'hmm'];
  const expWords = normalize(expected).split(' ').filter(w => w && !FILLERS.includes(w));
  const actWords = normalize(actual).split(' ').filter(w => w);
  const used = new Array(actWords.length).fill(false);
  const results = [];

  for (const expWord of expWords) {
    let found = false;
    // First: exact/synonym match
    for (let i = 0; i < actWords.length; i++) {
      if (!used[i] && wordsMatch(expWord, actWords[i])) {
        used[i] = true;
        found = true;
        break;
      }
    }
    // Second: try to find this word inside a glued word
    if (!found) {
      for (let i = 0; i < actWords.length; i++) {
        if (used[i]) continue;
        // Try splitting the actual word and matching the expected word
        const glued = actWords[i];
        if (glued.length > 6) {
          for (let j = 2; j < glued.length - 1; j++) {
            const part1 = glued.slice(0, j);
            const part2 = glued.slice(j);
            if (wordsMatch(expWord, part1) || wordsMatch(expWord, part2)) {
              // Mark as found, but don't consume the whole glued word
              // (the other part will be matched by another expected word)
                found = true;
              break;
            }
          }
        }
        if (found) break;
      }
    }
    results.push({ word: expWord, correct: found });
  }

  const correctCount = results.filter(r => r.correct).length;
  const score = expWords.length > 0 ? Math.round((correctCount / expWords.length) * 100) : 0;
  return { results, score, correctCount, total: expWords.length };
}

function bestMatch(expectedAnswers, actual) {
  let best = null;
  for (const exp of expectedAnswers) {
    const result = scoreOne(exp, actual);
    if (!best || result.score > best.score) best = { ...result, matchedAnswer: exp };
  }
  return best;
}

// ============================================================
// DIALOGUE FLOW
// ============================================================
function currentDialogue() { return dialogues[currentDialogueIndex]; }
function currentNode() { return currentDialogue().nodes[currentNodeId]; }

function updatePoints() { pointsValue.textContent = points; }

function populateDialogueSelect() {
  dialogueSelect.innerHTML = '';
  dialogues.forEach((d, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = d.title;
    dialogueSelect.appendChild(opt);
  });
  dialogueSelect.value = currentDialogueIndex;
}

function showStudentLine(text) {
  studentLine.textContent = text;
  studentBubble.classList.add('revealed');
}
function hideStudentLine() {
  studentBubble.classList.remove('revealed');
}

function displayClerkLine(text, translation, options = {}) {
  // Format numbers per level
  const formatted = formatText(text, level);
  clerkSpoken.textContent = '🔊 Click "Play question" to hear the clerk.';
  clerkWritten.textContent = formatted;

  if (level === 'dumb') {
    clerkWritten.classList.add('revealed');
    clerkTranslation.textContent = translation || '';
    clerkTranslation.classList.add('revealed');
    hintBtn.disabled = true;
    hintBtn.textContent = '💡 Visible (Dumb)';
  } else if (level === 'easy') {
    clerkWritten.classList.add('revealed');
    clerkTranslation.classList.remove('revealed');
    hintBtn.disabled = true;
    hintBtn.textContent = '💡 Visible (Easy)';
  } else {
    clerkWritten.classList.remove('revealed');
    clerkTranslation.classList.remove('revealed');
    hintBtn.disabled = false;
    hintBtn.textContent = `💡 Show text (−${HINT_COST} ⭐)`;
  }
}

function loadNode(nodeId) {
  currentNodeId = nodeId;
  const node = currentNode();
    // Situation box
  const situationBox = document.getElementById('situationBox');
  const situationText = document.getElementById('situationText');
  const situationTranslation = document.getElementById('situationTranslation');
  const dlg = currentDialogue();

  if (dlg.situation) {
    situationBox.style.display = 'block';
    situationText.textContent = dlg.situation;
    situationTranslation.textContent = dlg.situationTranslation || '';
    if (level === 'dumb') {
      situationTranslation.classList.add('revealed');
    } else {
      situationTranslation.classList.remove('revealed');
    }
  } else {
    situationBox.style.display = 'none';
  }
  hintUsedThisQuestion = false;
  attemptsThisNode = 0;
  usedAlternativeThisNode = false;

  dialogueTitle.textContent = currentDialogue().title;
  clerkLabel.textContent = currentDialogue().clerkLabel || 'Clerk';

  displayClerkLine(node.clerk, node.translation);

  hideStudentLine();
  resultBox.innerHTML = 'Your feedback will appear here after you speak.';
  nextBtn.style.display = 'none';
  continueBtn.style.display = 'none';
  recordBtn.style.display = '';
  recordBtn.disabled = false;
  playBtn.disabled = false;
  statusEl.textContent = '';
  recordBtn.textContent = '🎤 Speak answer';
  recordBtn.classList.remove('recording');
}

function showFeedback(transcript, comparison, outcome, pointsEarned) {
  const { results, score, correctCount, total, matchedAnswer } = comparison || {};
  let scoreClass = 'bad';
  if (score >= 80) scoreClass = 'good';
  else if (score >= CORRECT_THRESHOLD) scoreClass = 'mid';

  const wordHtml = (results || []).map(r =>
    `<span class="${r.correct ? 'word-correct' : 'word-wrong'}">${r.word}</span>`
  ).join(' ');

  let outcomeLine = '';
  if (outcome === 'correct') outcomeLine = `<div style="color:#27ae60;font-weight:bold;margin-top:6px;">+${pointsEarned} ⭐ — správně!</div>`;
  else if (outcome === 'alternative') outcomeLine = `<div style="color:#f39c12;font-weight:bold;margin-top:6px;">+${pointsEarned} ⭐ — dobrá odpověď!</div>`;
  else outcomeLine = `<div style="color:#e74c3c;font-weight:bold;margin-top:6px;">${pointsEarned} ⭐ — zkuste to znovu.</div>`;

  resultBox.innerHTML = `
    <div class="transcript">You said: "${transcript}"</div>
    <div class="score ${scoreClass}">${score}% — ${correctCount} / ${total} words correct</div>
    <div class="word-feedback">${wordHtml}</div>
    <div class="expected">Expected: "${formatText(matchedAnswer || '', level)}"</div>
    ${outcomeLine}
  `;
}

// ============================================================
// OUTCOME HANDLERS
// ============================================================
function handleCorrect(transcript, comparison, node) {
  points += 1;
  updatePoints();
  showFeedback(transcript, comparison, 'correct', 1);

  const nextId = node.correct ? node.correct.next : null;

  if (nextId) {
    nextBtn.style.display = '';
    nextBtn.disabled = false;
    nextBtn.textContent = '➡️ Další otázka';
    nextBtn.onclick = () => loadNode(nextId);
    recordBtn.disabled = true;
    playBtn.disabled = true;
    } else {
    resultBox.innerHTML = `
      <div class="score good">🎉 Dialogue complete! Final points: ${points} ⭐</div>
      <div style="margin-top:8px;"><strong>Your last answer:</strong> "${transcript}"</div>
      <div class="expected" style="margin-top:8px;">Expected: "${formatText(comparison.matchedAnswer || '', level)}"</div>
      <div style="margin-top:8px;">Score: ${comparison.score}% (${comparison.correctCount}/${comparison.total} words)</div>
    `;
    recordBtn.disabled = true;
    playBtn.disabled = true;
    nextBtn.style.display = '';
    nextBtn.disabled = false;
    nextBtn.textContent = '🔄 Restartovat dialog';
    nextBtn.onclick = () => {
      points = 10;
      updatePoints();
      loadNode(currentDialogue().start);
    };
  }
}

function handleAlternative(transcript, comparison, node) {
  points += 1;
  updatePoints();
  showFeedback(transcript, comparison, 'alternative', 1);

  // Show the clerk's reply
  const reply = node.alternative.clerkReply;
  const replyTrans = node.alternative.clerkReplyTranslation || '';
  displayClerkLine(reply, replyTrans);
  speak(reply);

  // Now wait for the student to acknowledge
  recordBtn.disabled = false;
  recordBtn.textContent = '🎤 Odpovědět';
  playBtn.disabled = true;
  continueBtn.style.display = 'none';
  statusEl.textContent = 'Clerk replied. Please respond.';

  // Set a flag so next recognition is treated as acknowledgement
  recognition.onresult = handleAcknowledgment;

  function handleAcknowledgment(event) {
    const ack = event.results[0][0].transcript;
    showStudentLine(ack);
    const ackComparison = bestMatch(node.alternative.studentAcknowledges, ack);

    // Any acknowledgement is accepted (no points)
    resultBox.innerHTML = `
      <div class="transcript">You said: "${ack}"</div>
      <div class="score mid">Odpověď přijata. Vracíme se k otázce.</div>
      <div class="expected">Expected: "${node.alternative.studentAcknowledges[0]}"</div>
    `;

    // Show continue button to go back to the same question
    continueBtn.style.display = '';
    continueBtn.textContent = '➡️ Zpět k otázce';
    continueBtn.onclick = () => {
      // Restore normal handler
      recognition.onresult = defaultOnResult;
      loadNode(node.alternative.returnTo || currentNodeId);
    };

    recordBtn.disabled = true;
    playBtn.disabled = true;

    // Restore default handler
    recognition.onresult = defaultOnResult;
  }
}

function handleChoice(transcript, comparison, node, nextNodeId) {
  points += 1;
  updatePoints();
  showFeedback(transcript, comparison, 'correct', 1);

  nextBtn.style.display = '';
  nextBtn.disabled = false;
  nextBtn.textContent = '➡️ Další otázka';
  nextBtn.onclick = () => loadNode(nextNodeId);
  recordBtn.disabled = true;
  playBtn.disabled = true;
}

function handleUnclear(transcript, comparison, node) {
  attemptsThisNode += 1;

  if (attemptsThisNode >= MAX_ATTEMPTS) {
    points -= 1;
    updatePoints();
    showFeedback(transcript, comparison, 'unclear', -1);
    resultBox.innerHTML += `<div style="color:#e74c3c;font-weight:bold;margin-top:6px;">Tři pokusy. Jdeme dál.</div>`;

    // Find next node — support correct.next or choices[0].next
    let nextId = null;
    if (node.correct && node.correct.next) nextId = node.correct.next;
    else if (node.choices && node.choices.length > 0) nextId = node.choices[0].next;

    if (nextId) {
      nextBtn.style.display = '';
      nextBtn.disabled = false;
      nextBtn.textContent = '➡️ Další otázka';
      nextBtn.onclick = () => loadNode(nextId);
        } else {
      resultBox.innerHTML += `<div class="score good">🎉 Konec dialogu. Body: ${points} ⭐</div>`;
      nextBtn.style.display = '';
      nextBtn.disabled = false;
      nextBtn.textContent = '🔄 Restartovat dialog';
      nextBtn.onclick = () => {
        points = 10;
        updatePoints();
        loadNode(currentDialogue().start);
      };
    }
    recordBtn.disabled = true;
    playBtn.disabled = true;
    return;
  }

  updatePoints();
  showFeedback(transcript, comparison, 'unclear', 0);

  const retry = node.unclear.clerk;
  const retryTrans = node.unclear.translation || '';
  displayClerkLine(retry, retryTrans);
  speak(retry);

  recordBtn.disabled = false;
  recordBtn.textContent = '🎤 Zkusit znovu';
  playBtn.disabled = true;
  statusEl.textContent = `Pokus ${attemptsThisNode} ze ${MAX_ATTEMPTS}. Zkuste to znovu.`;
}

// ============================================================
// MAIN VALIDATOR
// ============================================================
function evaluateAnswer(transcript) {
  const node = currentNode();

  // 1) Check against correct answers — only if this node has a "correct" block
  if (node.correct) {
    const correctComparison = bestMatch(node.correct.answers, transcript);
    if (correctComparison.score >= CORRECT_THRESHOLD) {
      return { outcome: 'correct', comparison: correctComparison };
    }
  }

  // 2) Check against choices (multiple equally-valid options)
  if (node.choices) {
    let bestChoice = null;
    for (const choice of node.choices) {
      const c = bestMatch(choice.answers, transcript);
      if (c.score >= CORRECT_THRESHOLD && (!bestChoice || c.score > bestChoice.comparison.score)) {
        bestChoice = { choice, comparison: c };
      }
    }
    if (bestChoice) {
      return { outcome: 'choice', comparison: bestChoice.comparison, choiceNext: bestChoice.choice.next };
    }
  }

  // 3) Check against alternative answers — only if not already used
  if (node.alternative && !usedAlternativeThisNode) {
    const altComparison = bestMatch(node.alternative.answers, transcript);
    if (altComparison.score >= CORRECT_THRESHOLD) {
      usedAlternativeThisNode = true;
      return { outcome: 'alternative', comparison: altComparison };
    }
  }

  // 4) Otherwise: unclear
  // Find any comparison to show feedback — prefer correct, then choices, then a dummy
  let fallbackComparison = null;
  if (node.correct) fallbackComparison = bestMatch(node.correct.answers, transcript);
  else if (node.choices && node.choices.length > 0) fallbackComparison = bestMatch(node.choices[0].answers, transcript);

  if (!fallbackComparison) {
    // Nothing to compare against — make a dummy
    fallbackComparison = { results: [], score: 0, correctCount: 0, total: 0, matchedAnswer: '' };
  }

  return { outcome: 'unclear', comparison: fallbackComparison };
}

// ============================================================
// DEFAULT RESULT HANDLER
// ============================================================
// ============================================================
// DEFAULT RESULT HANDLER
// ============================================================
function defaultOnResult(event) {
  const transcript = event.results[0][0].transcript;
  const node = currentNode();
  const { outcome, comparison, choiceNext } = evaluateAnswer(transcript);
  showStudentLine(transcript);

  if (outcome === 'correct') handleCorrect(transcript, comparison, node);
  else if (outcome === 'choice') handleChoice(transcript, comparison, node, choiceNext);
  else if (outcome === 'alternative') handleAlternative(transcript, comparison, node);
  else handleUnclear(transcript, comparison, node);
}

recognition.onresult = defaultOnResult;

// ============================================================
// EVENTS
// ============================================================
dialogueSelect.addEventListener('change', (e) => {
  currentDialogueIndex = parseInt(e.target.value);
  loadNode(currentDialogue().start);
});

function setLevel(newLevel) {
  level = newLevel;
  [dumbBtn, easyBtn, normalBtn].forEach(b => b.classList.remove('active'));
  if (level === 'dumb') dumbBtn.classList.add('active');
  else if (level === 'easy') easyBtn.classList.add('active');
  else normalBtn.classList.add('active');
  loadNode(currentNodeId);
}

dumbBtn.addEventListener('click', () => setLevel('dumb'));
easyBtn.addEventListener('click', () => setLevel('easy'));
normalBtn.addEventListener('click', () => setLevel('normal'));

playBtn.addEventListener('click', () => {
  const node = currentNode();
  const text = formatText(node.clerk, level);
  speak(text);
  clerkSpoken.textContent = '🔊 (playing...)';
  const checkEnd = setInterval(() => {
    if (!window.speechSynthesis.speaking) {
      clearInterval(checkEnd);
      clerkSpoken.textContent = '🔊 Question played. Click "Play question" to hear again.';
    }
  }, 200);
});

hintBtn.addEventListener('click', () => {
  if (level !== 'normal') return;
  if (hintUsedThisQuestion) return;
  points -= HINT_COST;
  updatePoints();
  clerkWritten.classList.add('revealed');
  clerkTranslation.classList.add('revealed');
  hintUsedThisQuestion = true;
  hintBtn.disabled = true;
  hintBtn.textContent = '💡 Text shown';
  statusEl.textContent = `−${HINT_COST} ⭐ for the text hint.`;
});

recordBtn.addEventListener('click', () => {
  if (!recognition) return;
  if (isRecording) { recognition.stop(); return; }
  isRecording = true;
  recordBtn.textContent = '🛑 Stop & check';
  recordBtn.classList.add('recording');
  statusEl.textContent = 'Listening... speak now.';
  recognition.start();
});

recognition.onerror = (event) => {
  statusEl.textContent = '⚠️ Error: ' + event.error + '. Try again.';
  recordBtn.textContent = '🎤 Speak answer';
  recordBtn.classList.remove('recording');
  isRecording = false;
};

recognition.onend = () => {
  isRecording = false;
  recordBtn.textContent = '🎤 Speak answer';
  recordBtn.classList.remove('recording');
};

// ============================================================
// INIT
// ============================================================
populateDialogueSelect();
updatePoints();
loadNode(currentDialogue().start);
</script>
